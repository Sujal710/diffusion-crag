name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Change "crag-app" if your Docker Hub repository has a different name.
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/crag-app

jobs:
  # ---------------------------------------------------------------- CI
  test:
    name: Lint and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
          pip install -r requirements.txt ruff

      # Only real errors: syntax errors, undefined names, unused or missing imports.
      - name: Lint
        run: ruff check crag_app --select E9,F

      - name: Byte-compile
        run: python -m compileall -q crag_app

      # Placeholder keys: the modules only need real ones when a request runs.
      - name: Import smoke test
        env:
          GROQ_API_KEY: ci-placeholder
          PINECONE_API_KEY: ci-placeholder
          TAVILY_API_KEY: ci-placeholder
        run: python -c "import crag_app.graph, crag_app.mcp_server, crag_app.api"

  # ------------------------------------------- build and push to Docker Hub
  docker:
    name: Build and push image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Pull requests only build (to prove the Dockerfile works); they never push.
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------ deploy to the EC2 server
  deploy:
    name: Deploy to EC2
    needs: docker
    # Only after a push to main; pull requests and tags never deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
    steps:
      - name: Set up SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -m 600 /dev/null key.pem
          # Strip Windows line endings, then make sure the file ends with a newline.
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > key.pem
          ssh-keygen -y -f key.pem > /dev/null && echo "SSH key looks valid."

      # Token goes over stdin, so it never shows up in a process list or the logs.
      - name: Log in to Docker Hub on the server
        run: |
          printf '%s' "${{ secrets.DOCKERHUB_TOKEN }}" | ssh -i key.pem -o StrictHostKeyChecking=accept-new \
            "$EC2_USER@$EC2_HOST" "docker login -u '${{ secrets.DOCKERHUB_USERNAME }}' --password-stdin"

      - name: Pull the image and restart the container
        run: |
          ssh -i key.pem -o StrictHostKeyChecking=accept-new "$EC2_USER@$EC2_HOST" \
            "IMAGE=${{ env.IMAGE }}:latest bash -s" <<'REMOTE'
          set -e
          docker pull "$IMAGE"
          docker rm -f crag 2>/dev/null || true
          docker run -d --name crag --restart unless-stopped \
            -p 8000:8000 --env-file "$HOME/crag/.env" \
            -v crag_data:/app/crag_app/data \
            -v crag_outputs:/app/crag_app/outputs \
            "$IMAGE"
          docker image prune -f
          REMOTE

      - name: Wait for the app to answer
        run: |
          for i in $(seq 1 12); do
            if ssh -i key.pem -o StrictHostKeyChecking=accept-new "$EC2_USER@$EC2_HOST" \
                 "curl -fsS http://localhost:8000/health"; then
              echo; echo "App is up."; exit 0
            fi
            sleep 10
          done
          echo "App did not become healthy in 2 minutes." >&2
          ssh -i key.pem "$EC2_USER@$EC2_HOST" "docker logs crag --tail 50" || true
          exit 1

      - name: Remove SSH key
        if: always()
        run: rm -f key.pem
