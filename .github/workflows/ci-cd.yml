name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Change "crag-app" if your Docker Hub repository has a different name.
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/crag-app

jobs:
  # ---------------------------------------------------------------- CI
  test:
    name: Lint and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
          pip install -r requirements.txt ruff

      # Only real errors: syntax errors, undefined names, unused or missing imports.
      - name: Lint
        run: ruff check crag_app --select E9,F

      - name: Byte-compile
        run: python -m compileall -q crag_app

      # Placeholder keys: the modules only need real ones when a request runs.
      - name: Import smoke test
        env:
          GROQ_API_KEY: ci-placeholder
          PINECONE_API_KEY: ci-placeholder
          TAVILY_API_KEY: ci-placeholder
        run: python -c "import crag_app.graph, crag_app.mcp_server, crag_app.api"

  # ------------------------------------------- build and push to Docker Hub
  docker:
    name: Build and push image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Pull requests only build (to prove the Dockerfile works); they never push.
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
